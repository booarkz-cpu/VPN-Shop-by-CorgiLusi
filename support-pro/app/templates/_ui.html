{% macro icon(name, cls='') -%}<svg class="icon {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="/static/icons.svg#{{ name }}"></use></svg>{%- endmacro %}
{% macro pagehead(kicker, title, description='') %}<div class="page-heading"><div><p class="eyebrow">{{ kicker }}</p><h1>{{ title }}</h1>{% if description %}<p class="page-description">{{ description }}</p>{% endif %}</div>{% if caller is defined %}<div class="page-actions">{{ caller() }}</div>{% endif %}</div>{% endmacro %}
