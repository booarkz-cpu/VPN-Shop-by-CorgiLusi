{% extends 'base.html' %}{% from '_ui.html' import icon, pagehead %}{% block content %}{{ pagehead('СИСТЕМА', 'Автоматизация', 'Правила, которые помогают команде реагировать одинаково и вовремя.') }}{% for r in rules %}<form method="post" action="/rules/{{ r.id }}" class="card stack"><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="filters"><label>Название<input name="title" value="{{ r.title }}" maxlength="160" required></label><label>Событие<input name="event" value="{{ r.event }}" maxlength="50" required></label><label class="check"><input type="checkbox" name="enabled" {% if r.enabled %}checked{% endif %}>Включено</label></div><label>Условия JSON<textarea name="conditions" rows="3">{{ r.conditions|tojson }}</textarea></label><label>Действия JSON<textarea name="actions" rows="3">{{ r.actions|tojson }}</textarea></label><button class="secondary">Сохранить правило</button></form>{% endfor %}<form method="post" class="card stack"><h2>Новое правило</h2><input type="hidden" name="csrf_token" value="{{ csrf }}"><div class="filters"><label>Название<input name="title" required maxlength="160"></label><label>Событие<input name="event" placeholder="ticket.created" required maxlength="50"></label></div><label>Условия JSON<textarea name="conditions" rows="3">{}</textarea></label><label>Действия JSON<textarea name="actions" rows="3">{}</textarea></label><label class="check"><input type="checkbox" name="enabled" checked>Включено</label><button>Добавить правило</button></form>{% endblock %}
