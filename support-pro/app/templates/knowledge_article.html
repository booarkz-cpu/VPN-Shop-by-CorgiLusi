{% extends 'base.html' %}{% from '_ui.html' import icon %}{% block content %}<article class="card article-public"><p class="eyebrow">ЦЕНТР ПОМОЩИ</p><h1>{{ article.title }}</h1><p class="muted">Обновлено {{ article.updated_at|dt }} · {{ article.views }} просмотров</p><div class="message-text">{{ article.body }}</div><div class="article-feedback"><span>Была ли статья полезна?</span><form method="post" action="/kb/{{ article.slug }}/feedback"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="secondary" name="vote" value="yes">Да</button><button class="secondary" name="vote" value="no">Нет</button></form></div></article>{% endblock %}
