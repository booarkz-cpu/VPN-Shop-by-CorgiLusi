name: Publish GitHub release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release-v20.0.6.md
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish v20.0.6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the README and security notes
        run: node .github/assemble-docs.js

      - name: Publish the assembled documents
        id: docs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            async function put(filePath) {
              const content = Buffer.from(fs.readFileSync(filePath)).toString('base64');
              let sha;
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: 'main',
                });
                if (!Array.isArray(current.data)) sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                const result = await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  message: `Assemble ${filePath} for v20.0.6`,
                  content,
                  sha,
                  branch: 'main',
                });
                return result.data.commit.sha;
              } catch (error) {
                const message = String(error.message || error);
                if (error.status === 409 || message.includes('identical')) {
                  core.info(`${filePath} is already current`);
                  return context.sha;
                }
                throw error;
              }
            }
            await put('README.md');
            const sha = await put('SECURITY.md');
            core.setOutput('sha', sha);

      - name: Create or update the release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/release-v20.0.6.md', 'utf8');
            const tag = 'v20.0.6';
            const name = 'v20.0.6 — staging E2E';
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name,
              body,
              draft: false,
              prerelease: false,
            };
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                ...common,
                release_id: existing.data.id,
              });
              core.info(`Updated ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease({
                ...common,
                target_commitish: '${{ steps.docs.outputs.sha }}',
              });
              core.info(`Created ${created.data.html_url}`);
            }
