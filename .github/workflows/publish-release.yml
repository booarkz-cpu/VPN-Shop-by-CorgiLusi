name: Publish GitHub release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release-v20.0.5.md
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish v20.0.5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update the release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/release-v20.0.5.md', 'utf8');
            const tag = 'v20.0.5';
            const name = 'v20.0.5 — сверка ЮKassa';
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name,
              body,
              draft: false,
              prerelease: false,
            };
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                ...common,
                release_id: existing.data.id,
              });
              core.info(`Updated ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease({
                ...common,
                target_commitish: context.sha,
              });
              core.info(`Created ${created.data.html_url}`);
            }
