name: Publish GitHub release

on:
  workflow_run:
    workflows: ["Corgi Lusi CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Publish v20.0.12 after CI
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require successful CI on this commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = (await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main'
            })).data.commit.sha;
            if (sha !== context.payload.workflow_run.head_sha) {
              throw new Error('The successful CI commit is no longer current main.');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'ci.yml', head_sha: sha, status: 'completed', per_page: 20
            });
            if (!runs.data.workflow_runs.some(run => run.event === 'push' && run.conclusion === 'success')) {
              throw new Error(`No successful main push CI run for ${sha}`);
            }
      - name: Package v20.0.12
        run: |
          python3 scripts/package-source.py remnawave_vpn_shop_v20_0_12_full_release.zip
          sha256sum remnawave_vpn_shop_v20_0_12_full_release.zip > remnawave_vpn_shop_v20_0_12_full_release.zip.sha256
      - name: Create release and attach verified source
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'v20.0.12';
            const body = fs.readFileSync('.github/release-v20.0.12.md', 'utf8');
            try {
              await github.rest.repos.getReleaseByTag({owner: context.repo.owner, repo: context.repo.repo, tag});
              throw new Error(`${tag} already exists; refusing to overwrite an existing release`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const result = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, target_commitish: context.payload.workflow_run.head_sha,
              name: 'v20.0.12 — проверка прав и резервных копий', body,
              draft: true, prerelease: false
            });
            for (const name of [
              'remnawave_vpn_shop_v20_0_12_full_release.zip',
              'remnawave_vpn_shop_v20_0_12_full_release.zip.sha256'
            ]) {
              const data = fs.readFileSync(name);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner, repo: context.repo.repo,
                release_id: result.data.id, name, data,
                headers: { 'content-type': name.endsWith('.zip') ? 'application/zip' : 'text/plain', 'content-length': data.length }
              });
            }
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: result.data.id, draft: false
            });
            core.info(`Published ${result.data.html_url}`);
