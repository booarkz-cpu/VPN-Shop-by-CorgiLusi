name: Publish GitHub release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release-v20.0.6.md
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish v20.0.6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the README and security notes
        run: node .github/assemble-docs.js

      - name: Push the assembled documents
        id: branch
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          readme = Path("README.md").read_bytes()
          if "Как пройти staging E2E".encode() not in readme or len(readme) < 120000:
              raise SystemExit(f"README was not assembled: bytes={len(readme)}")
          security = Path("SECURITY.md").read_bytes()
          if "Аудит 20.0.6".encode() not in security:
              raise SystemExit(f"SECURITY was not assembled: bytes={len(security)}")
          print(f"assembled README={len(readme)} SECURITY={len(security)}")
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          branch="cursor/assemble-docs-${GITHUB_RUN_ID}-c0ec"
          git checkout -b "$branch"
          git add README.md SECURITY.md
          git commit -m "Assemble README and SECURITY for v20.0.6"
          git push origin "HEAD:${branch}"
          echo "name=${branch}" >> "$GITHUB_OUTPUT"
          echo "::notice::assembled-branch=${branch}"

      - name: Create or update the release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/release-v20.0.6.md', 'utf8');
            const tag = 'v20.0.6';
            const name = 'v20.0.6 — staging E2E';
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name,
              body,
              draft: false,
              prerelease: false,
            };
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                ...common,
                release_id: existing.data.id,
              });
              core.info(`Updated ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease({
                ...common,
                target_commitish: context.sha,
              });
              core.info(`Created ${created.data.html_url}`);
            }
