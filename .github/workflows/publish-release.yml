name: Publish GitHub release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/release-v20.0.6.md
      - .github/workflows/publish-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish v20.0.6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the README and security notes
        run: node .github/assemble-docs.js

      - name: Push the assembled documents
        id: branch
        run: |
          set +e
          {
            set -euo pipefail
            python3 -c 'from pathlib import Path; readme = Path("README.md").read_bytes(); security = Path("SECURITY.md").read_bytes(); ok = "Как пройти staging E2E".encode() in readme and len(readme) >= 120000 and "Аудит 20.0.6".encode() in security; print("assembled", len(readme), len(security), ok); raise SystemExit(0 if ok else 1)'
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            branch="cursor/assemble-docs-${GITHUB_RUN_ID}-c0ec"
            git checkout -b "$branch"
            git add README.md SECURITY.md
            git commit -m "Assemble README and SECURITY for v20.0.6"
            git push origin "HEAD:${branch}"
            echo "name=${branch}" >> "$GITHUB_OUTPUT"
            echo "$branch" > /tmp/assemble-branch.txt
          } > /tmp/assemble-push.log 2>&1
          echo $? > /tmp/assemble-push.code

      - name: Report the assembled branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const code = Number(fs.readFileSync('/tmp/assemble-push.code', 'utf8').trim());
            const text = fs.readFileSync('/tmp/assemble-push.log', 'utf8').slice(-1500);
            if (code !== 0) {
              throw new Error(text);
            }
            core.notice(text);

      - name: Create or update the release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/release-v20.0.6.md', 'utf8');
            const tag = 'v20.0.6';
            const name = 'v20.0.6 — staging E2E';
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name,
              body,
              draft: false,
              prerelease: false,
            };
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                ...common,
                release_id: existing.data.id,
              });
              core.info(`Updated ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease({
                ...common,
                target_commitish: context.sha,
              });
              core.info(`Created ${created.data.html_url}`);
            }
