name: Corgi Lusi CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend • Python + tests + migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vpnshop
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: vpnshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vpnshop -d vpnshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_SECRET: ci-only-secret
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vpnshop:ci-password@127.0.0.1:5432/vpnshop
      DB_USER: vpnshop
      DB_PASSWORD: ci-password
      DB_NAME: vpnshop
      REDIS_URL: redis://127.0.0.1:6379/0
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      PAYMENTS_SANDBOX: "true"
      MOBILE_REQUIRE_PROOF: "false"
      AUTO_RENEW_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile Python
        working-directory: backend
        run: python -m compileall -q app worker.py
      - name: Alembic heads
        working-directory: backend
        run: alembic heads
      - name: Alembic upgrade
        working-directory: backend
        run: alembic upgrade head
      - name: Tests
        run: python -m pytest -q tests --disable-warnings --maxfail=1

  frontend:
    name: ${{ matrix.app }} • typecheck + build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin, miniapp, cabinet]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose • configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          cp .env.test.example .env.test
          docker compose --env-file .env.test -f docker-compose.test.yml config --quiet
