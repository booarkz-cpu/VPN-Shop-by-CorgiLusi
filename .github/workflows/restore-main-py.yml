name: restore-main-py
on:
  push:
    paths:
      - ".github/workflows/restore-main-py.yml"
      - ".github/restore_main.py"
permissions:
  contents: write
  statuses: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore backend/app/main.py
        run: |
          set +e
          python3 .github/restore_main.py > /tmp/restore-log.txt 2>&1
          code=$?
          line=$(grep '^PUSH ' /tmp/restore-log.txt | tail -n 1 | tr '\n' ' ' | cut -c6-145)
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/booarkz-cpu/VPN-Shop-by-CorgiLusi/statuses/${{ github.sha }} \
            -d "{\"state\":\"failure\",\"context\":\"restore-debug\",\"description\":\"${line}\"}"
          exit ${code}
