name: restore-main-py
on:
  push:
    paths:
      - ".github/workflows/restore-main-py.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore backend/app/main.py
        run: |
          set +e
          {
            python3 - << 'PY'
            import hashlib
            from pathlib import Path
            root = Path(".publish-restore")
            print("parts", sorted(p.name for p in root.glob("*")))
            chunks = []
            for i in range(11):
                raw = root / f"part-{i:02d}"
                if not raw.is_file():
                    raise SystemExit("missing part %02d" % i)
                chunks.append(raw.read_bytes())
            data = b"".join(chunks)
            data = data.replace(b"{{ARROW}}", "\u2192".encode().decode("unicode_escape").encode())
            data = data.replace(b"{{EMDASH}}", "\u2014".encode().decode("unicode_escape").encode())
            digest = hashlib.sha256(data).hexdigest()
            print(len(data), digest)
            if len(data) != 381229 or digest != "32b6f12649d21819844afb7b9fa4f8d7618560ff57bb7f00046a827e75eb7471":
                raise SystemExit("restored main.py hash mismatch")
            Path("backend/app/main.py").write_bytes(data)
            print("wrote main.py")
            PY
            echo "python_exit:$?"
            git config user.name "booarkz-cpu"
            git config user.email "boo.ar.kz@gmail.com"
            git add backend/app/main.py
            echo "add_exit:$?"
            git rm -r .publish-restore
            echo "rm_exit:$?"
            git commit -m "Restore backend/app/main.py from the audited source."
            echo "commit_exit:$?"
            git push origin HEAD:main
            echo "push_exit:$?"
          } > /tmp/restore-log.txt 2>&1
          python3 - << 'PY'
          from pathlib import Path
          text = Path("/tmp/restore-log.txt").read_text()[-3000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error::" + text)
          PY
          exit 1
