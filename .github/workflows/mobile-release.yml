name: Mobile packages

on:
  pull_request:
    paths: ['mobile/**', 'scripts/build-android-apk.sh', 'scripts/build-ios-packages.sh', '.github/workflows/mobile-release.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'scripts/build-android-apk.sh', 'scripts/build-ios-packages.sh', '.github/workflows/mobile-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Build Android packages
        env:
          # Pull requests never receive the production signing identity.
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS"
            test -n "$ANDROID_KEY_PASSWORD"
            export ANDROID_KEYSTORE="$RUNNER_TEMP/mobile-release.jks"
            trap 'rm -f "$ANDROID_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE"
            kind=release
          else
            kind=preview
            echo 'No release keystore: building isolated .preview applications.'
          fi
          bash scripts/build-android-apk.sh "$PWD/dist/mobile"
          for apk in dist/mobile/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$apk.certificate.txt"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$apk.package.txt"
            grep -q "versionCode='2141'" "$apk.package.txt"
            if [[ "$kind" == preview ]]; then
              grep -q "name='shop.remnawave.*.preview'" "$apk.package.txt"
              grep -q "versionName='2.14.1-preview'" "$apk.package.txt"
            else
              grep -q "versionName='2.14.1'" "$apk.package.txt"
              ! grep -q "application-debuggable" "$apk.package.txt"
            fi
          done
          printf '%s\n' "$kind" > dist/mobile/android-signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS device and simulator packages
        run: bash scripts/build-ios-packages.sh "$PWD/dist/mobile"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: dist/mobile/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mobile-*
          merge-multiple: true
          path: dist/mobile
      - name: Verify checksums and record provenance
        run: |
          cd dist/mobile
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          printf 'commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > BUILD.txt
          cp ../../docs/ru/MOBILE_RELEASE_2_14_1.md INSTALL_RU.md
          cp ../../LICENSE LICENSE.txt
          sha256sum *.apk *.ipa *.zip > SHA256SUMS
      - name: Publish mobile prerelease
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = 'mobile-v2.14.1';
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            // Do not publish a stale main build or silently replace an existing binary.
            const main = await github.rest.repos.getBranch({...args, branch: 'main'});
            if (main.data.commit.sha !== context.sha) throw new Error('Main moved; rerun for current main.');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({...args, tag})).data;
              if (!release.draft) { core.info(`Already published: ${release.html_url}`); return; }
              if (release.target_commitish !== context.sha) throw new Error('Draft belongs to another commit.');
            } catch (e) { if (e.status !== 404) throw e; }
            const kind = fs.readFileSync('dist/mobile/android-signing.txt', 'utf8').trim();
            const body = fs.readFileSync('.github/release-mobile-v2.14.1.md', 'utf8') +
              `\nAndroid signing: **${kind}**.\n\nSource commit: \`${context.sha}\`.\n`;
            if (!release) release = (await github.rest.repos.createRelease({...args,
              tag_name: tag, target_commitish: context.sha, name: 'Mobile 2.14.1 — Android и iOS / PKCE',
              body, draft: true, prerelease: true, make_latest: 'false'
            })).data;
            const existing = await github.rest.repos.listReleaseAssets({...args, release_id: release.id, per_page: 100});
            for (const asset of existing.data) await github.rest.repos.deleteReleaseAsset({...args, asset_id: asset.id});
            for (const name of fs.readdirSync('dist/mobile').sort()) {
              const data = fs.readFileSync(`dist/mobile/${name}`);
              await github.rest.repos.uploadReleaseAsset({...args, release_id: release.id, name, data,
                headers: {'content-type': 'application/octet-stream', 'content-length': data.length}});
            }
            await github.rest.repos.updateRelease({...args, release_id: release.id, body, draft: false,
              prerelease: true, make_latest: 'false'});
            core.info(`Published ${release.html_url}`);
