global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - vpnshop-alerts.yml
scrape_configs:
  - job_name: vpnshop
    scheme: https
    metrics_path: /metrics
    scrape_timeout: 10s
    static_configs:
      - targets: ['api.example.com:443']
    http_headers:
      X-Metrics-Token:
        files: ['/etc/prometheus/secrets/vpnshop-metrics-token']
